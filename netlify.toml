[build]
  command = "node scripts/netlify-build.mjs"
  publish = "out"

[functions]
  included_files = [
    "!node_modules/@img/sharp-darwin-*/**/*",
    "!node_modules/@img/sharp-win32-*/**/*",
    "!node_modules/@img/sharp-wasm32/**/*",
    "!node_modules/@img/sharp-linux-arm/**/*",
    "!node_modules/@img/sharp-linux-arm64/**/*",
    "!node_modules/@img/sharp-linux-ppc64/**/*",
    "!node_modules/@img/sharp-linux-riscv64/**/*",
    "!node_modules/@img/sharp-linux-s390x/**/*",
    "!node_modules/@img/sharp-linuxmusl-*/**/*",
    "!node_modules/@img/sharp-libvips-darwin-*/**/*",
    "!node_modules/@img/sharp-libvips-linux-arm/**/*",
    "!node_modules/@img/sharp-libvips-linux-arm64/**/*",
    "!node_modules/@img/sharp-libvips-linux-ppc64/**/*",
    "!node_modules/@img/sharp-libvips-linux-riscv64/**/*",
    "!node_modules/@img/sharp-libvips-linux-s390x/**/*",
    "!node_modules/@img/sharp-libvips-linuxmusl-*/**/*"
  ]

[[redirects]]
  from = "/pricing"
  to = "/fractional-finop/"
  status = 301

[[redirects]]
  from = "/careers"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/blog"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/blog/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"

  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com; upgrade-insecure-requests"
