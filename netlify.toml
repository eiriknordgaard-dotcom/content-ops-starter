[build]
  command = "node scripts/netlify-build.mjs"
  publish = "out"

[functions]
  included_files = [
    "!node_modules/@img/sharp-darwin-*/**/*",
    "!node_modules/@img/sharp-win32-*/**/*",
    "!node_modules/@img/sharp-wasm32/**/*",
    "!node_modules/@img/sharp-linux-arm/**/*",
    "!node_modules/@img/sharp-linux-arm64/**/*",
    "!node_modules/@img/sharp-linux-ppc64/**/*",
    "!node_modules/@img/sharp-linux-riscv64/**/*",
    "!node_modules/@img/sharp-linux-s390x/**/*",
    "!node_modules/@img/sharp-linuxmusl-*/**/*",
    "!node_modules/@img/sharp-libvips-darwin-*/**/*",
    "!node_modules/@img/sharp-libvips-linux-arm/**/*",
    "!node_modules/@img/sharp-libvips-linux-arm64/**/*",
    "!node_modules/@img/sharp-libvips-linux-ppc64/**/*",
    "!node_modules/@img/sharp-libvips-linux-riscv64/**/*",
    "!node_modules/@img/sharp-libvips-linux-s390x/**/*",
    "!node_modules/@img/sharp-libvips-linuxmusl-*/**/*"
  ]

[[redirects]]
  from = "/go/linkedin"
  to = "/?utm_source=linkedin&utm_medium=organic_social&utm_campaign=linkedin_profile"
  status = 302

[[redirects]]
  from = "/go/linkedin/finop-consulting"
  to = "/?utm_source=linkedin&utm_medium=organic_social&utm_campaign=finop_consulting&utm_content=homepage"
  status = 302

[[redirects]]
  from = "/go/linkedin/what-does-a-finop-do"
  to = "/what-does-a-finop-do/?utm_source=linkedin&utm_medium=organic_social&utm_campaign=finop_education&utm_content=what_does_a_finop_do"
  status = 302

[[redirects]]
  from = "/go/linkedin/series-27-vs-28"
  to = "/series-27-vs-series-28-finop/?utm_source=linkedin&utm_medium=organic_social&utm_campaign=finop_education&utm_content=series_27_vs_28"
  status = 302

[[redirects]]
  from = "/go/linkedin/outsourced-vs-in-house"
  to = "/outsourced-vs-in-house-finop/?utm_source=linkedin&utm_medium=organic_social&utm_campaign=outsourced_finop&utm_content=outsourced_vs_in_house"
  status = 302

[[redirects]]
  from = "/go/linkedin/fractional-finop"
  to = "/fractional-finop/?utm_source=linkedin&utm_medium=organic_social&utm_campaign=outsourced_finop&utm_content=fractional_finop"
  status = 302

[[redirects]]
  from = "/go/linkedin/audit-readiness"
  to = "/finop-audit-readiness-checklist/?utm_source=linkedin&utm_medium=organic_social&utm_campaign=audit_readiness&utm_content=checklist"
  status = 302

[[redirects]]
  from = "/pricing"
  to = "/fractional-finop/"
  status = 301

[[redirects]]
  from = "/careers"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/blog"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/blog/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/_next/static/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"

  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com; upgrade-insecure-requests"
