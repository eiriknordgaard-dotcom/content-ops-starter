name: Production monitor

on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Open a test alert after the live smoke check passes'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run smoke:production
      - name: Simulate monitor failure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure }}
        run: |
          echo "Controlled failure requested for alert-path verification."
          exit 1
      - name: Open or update production alert
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const { handleMonitorAlert } = require('./scripts/production-monitor-alert.cjs');
            await handleMonitorAlert({
              github,
              context,
              outcome: 'failure',
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: Close recovered production alert
        if: ${{ success() }}
        uses: actions/github-script@v7
        with:
          script: |
            const { handleMonitorAlert } = require('./scripts/production-monitor-alert.cjs');
            await handleMonitorAlert({
              github,
              context,
              outcome: 'success',
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
