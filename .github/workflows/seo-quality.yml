name: Production quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-TEST123456
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Select the installed Chromium for Lighthouse
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "CHROME_PATH=" + require("playwright").chromium.executablePath() + "\n")'
      - name: Verify local release candidate
        run: npm run verify:release
      - run: npm audit --omit=dev --audit-level=critical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-quality-results
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 14
