<svg width="640" height="440" viewBox="0 0 640 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cardShadow" x="-4%" y="-2%" width="108%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0F2235" flood-opacity="0.12"/>
    </filter>
    <filter id="lightShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0F2235" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background card -->
  <rect x="40" y="24" width="560" height="392" rx="12" fill="#F7F8FA" filter="url(#cardShadow)"/>

  <!-- Header bar -->
  <rect x="40" y="24" width="560" height="52" rx="12" fill="#0F2235"/>
  <rect x="40" y="52" width="560" height="24" fill="#0F2235"/>
  <!-- Header title placeholder -->
  <rect x="68" y="42" width="140" height="8" rx="4" fill="white" opacity="0.8"/>
  <rect x="68" y="56" width="90" height="6" rx="3" fill="white" opacity="0.3"/>

  <!-- Status badge - right side of header -->
  <rect x="480" y="40" width="92" height="26" rx="13" fill="#1B5E7B"/>
  <rect x="498" y="50" width="56" height="6" rx="3" fill="white" opacity="0.9"/>

  <!-- Main checklist area -->
  <!-- Section label: FINOP Compliance Checklist -->
  <rect x="68" y="100" width="180" height="7" rx="3.5" fill="#0F2235" opacity="0.5"/>

  <!-- Checklist item 1 - Checked -->
  <g filter="url(#lightShadow)">
    <rect x="68" y="124" width="504" height="42" rx="8" fill="white"/>
  </g>
  <rect x="84" y="137" width="18" height="18" rx="5" fill="#1B5E7B"/>
  <path d="M89 146.5L92.5 150L97 143" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="114" y="140" width="180" height="6" rx="3" fill="#0F2235" opacity="0.35"/>
  <rect x="114" y="152" width="120" height="4" rx="2" fill="#0F2235" opacity="0.15"/>
  <!-- Green status pill -->
  <rect x="494" y="139" width="62" height="20" rx="10" fill="#34A853" opacity="0.12"/>
  <rect x="508" y="146" width="34" height="6" rx="3" fill="#34A853" opacity="0.7"/>

  <!-- Checklist item 2 - Checked -->
  <g filter="url(#lightShadow)">
    <rect x="68" y="176" width="504" height="42" rx="8" fill="white"/>
  </g>
  <rect x="84" y="189" width="18" height="18" rx="5" fill="#1B5E7B"/>
  <path d="M89 198.5L92.5 202L97 195" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="114" y="192" width="200" height="6" rx="3" fill="#0F2235" opacity="0.35"/>
  <rect x="114" y="204" width="140" height="4" rx="2" fill="#0F2235" opacity="0.15"/>
  <!-- Green status pill -->
  <rect x="494" y="191" width="62" height="20" rx="10" fill="#34A853" opacity="0.12"/>
  <rect x="508" y="198" width="34" height="6" rx="3" fill="#34A853" opacity="0.7"/>

  <!-- Checklist item 3 - Checked -->
  <g filter="url(#lightShadow)">
    <rect x="68" y="228" width="504" height="42" rx="8" fill="white"/>
  </g>
  <rect x="84" y="241" width="18" height="18" rx="5" fill="#1B5E7B"/>
  <path d="M89 250.5L92.5 254L97 247" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="114" y="244" width="160" height="6" rx="3" fill="#0F2235" opacity="0.35"/>
  <rect x="114" y="256" width="100" height="4" rx="2" fill="#0F2235" opacity="0.15"/>
  <!-- Green status pill -->
  <rect x="494" y="243" width="62" height="20" rx="10" fill="#34A853" opacity="0.12"/>
  <rect x="508" y="250" width="34" height="6" rx="3" fill="#34A853" opacity="0.7"/>

  <!-- Checklist item 4 - Checked -->
  <g filter="url(#lightShadow)">
    <rect x="68" y="280" width="504" height="42" rx="8" fill="white"/>
  </g>
  <rect x="84" y="293" width="18" height="18" rx="5" fill="#1B5E7B"/>
  <path d="M89 302.5L92.5 306L97 299" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="114" y="296" width="190" height="6" rx="3" fill="#0F2235" opacity="0.35"/>
  <rect x="114" y="308" width="130" height="4" rx="2" fill="#0F2235" opacity="0.15"/>
  <!-- Green status pill -->
  <rect x="494" y="295" width="62" height="20" rx="10" fill="#34A853" opacity="0.12"/>
  <rect x="508" y="302" width="34" height="6" rx="3" fill="#34A853" opacity="0.7"/>

  <!-- Checklist item 5 - In progress -->
  <g filter="url(#lightShadow)">
    <rect x="68" y="332" width="504" height="42" rx="8" fill="white"/>
  </g>
  <rect x="84" y="345" width="18" height="18" rx="5" fill="none" stroke="#1B5E7B" stroke-width="1.8"/>
  <!-- Partial fill for in-progress look -->
  <rect x="114" y="348" width="170" height="6" rx="3" fill="#0F2235" opacity="0.35"/>
  <rect x="114" y="360" width="110" height="4" rx="2" fill="#0F2235" opacity="0.15"/>
  <!-- Amber/yellow status pill -->
  <rect x="486" y="347" width="78" height="20" rx="10" fill="#FBBC04" opacity="0.15"/>
  <rect x="502" y="354" width="46" height="6" rx="3" fill="#FBBC04" opacity="0.7"/>

  <!-- Checklist item 6 - Pending -->
  <g filter="url(#lightShadow)">
    <rect x="68" y="384" width="504" height="42" rx="8" fill="white" opacity="0.7"/>
  </g>
  <rect x="84" y="397" width="18" height="18" rx="5" fill="none" stroke="#CDD4DE" stroke-width="1.5"/>
  <rect x="114" y="400" width="150" height="6" rx="3" fill="#0F2235" opacity="0.2"/>
  <rect x="114" y="412" width="90" height="4" rx="2" fill="#0F2235" opacity="0.1"/>
  <!-- Gray status pill -->
  <rect x="494" y="399" width="62" height="20" rx="10" fill="#E9ECF1"/>
  <rect x="508" y="406" width="34" height="6" rx="3" fill="#0F2235" opacity="0.15"/>

  <!-- Progress bar at bottom -->
  <rect x="68" y="100" width="504" height="0" fill="none"/>

  <!-- Top-right decorative element: completion percentage -->
  <text x="420" y="108" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1B5E7B" opacity="0.7">4 of 6 complete</text>

  <!-- Small progress bar under header -->
  <rect x="420" y="114" width="152" height="4" rx="2" fill="#E9ECF1"/>
  <rect x="420" y="114" width="101" height="4" rx="2" fill="#1B5E7B" opacity="0.6"/>
</svg>