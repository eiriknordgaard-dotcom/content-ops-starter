<svg width="520" height="160" viewBox="0 0 520 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .formation-module {
      opacity: 0;
      transform: translateY(7px);
      animation: formation-module-in 650ms cubic-bezier(.22,.76,.22,1) forwards;
    }
    .formation-module-1 { animation-delay: 250ms; }
    .formation-module-2 { animation-delay: 500ms; }
    .formation-module-3 { animation-delay: 750ms; }
    .formation-check {
      opacity: 0;
      transform: scale(.72);
      transform-box: fill-box;
      transform-origin: center;
      animation: formation-check-in 550ms cubic-bezier(.2,.82,.3,1.22) forwards;
    }
    .formation-check-1 { animation-delay: 1450ms; }
    .formation-check-2 { animation-delay: 1900ms; }
    .formation-check-3 { animation-delay: 2350ms; }
    @keyframes formation-module-in {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes formation-check-in {
      to { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .formation-module,
      .formation-check {
        opacity: 1;
        transform: none;
        animation: none;
      }
    }
  </style>
