<svg width="735" height="464" viewBox="0 0 735 464" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Central node drop shadow -->
    <filter id="cs" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="b"/>
      <feOffset dy="3" result="o"/>
      <feFlood flood-color="#081422" flood-opacity="0.15"/>
      <feComposite in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Outer node drop shadow -->
    <filter id="ns" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
      <feOffset dy="2" result="o"/>
      <feFlood flood-color="#081422" flood-opacity="0.10"/>
      <feComposite in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Central node fill gradient -->
    <radialGradient id="cf" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6ECF3"/>
    </radialGradient>
    <!-- Outer node fill gradient -->
    <radialGradient id="nf" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAEdf2"/>
    </radialGradient>
    <!-- Green accent gradient for central shield -->
    <linearGradient id="sg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B9E4A"/>
      <stop offset="100%" stop-color="#07793A"/>
    </linearGradient>
    <!-- Connector line gradient (top-left) -->
    <linearGradient id="cl1" x1="367" y1="232" x2="198" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#091D33" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#091D33" stop-opacity="0.20"/>
    </linearGradient>
    <!-- Connector line gradient (top-right) -->
    <linearGradient id="cl2" x1="367" y1="232" x2="537" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#091D33" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#091D33" stop-opacity="0.20"/>
    </linearGradient>
    <!-- Connector line gradient (bottom-left) -->
    <linearGradient id="cl3" x1="367" y1="232" x2="198" y2="349" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#091D33" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#091D33" stop-opacity="0.20"/>
    </linearGradient>
    <!-- Connector line gradient (bottom-right) -->
    <linearGradient id="cl4" x1="367" y1="232" x2="537" y2="349" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#091D33" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#091D33" stop-opacity="0.20"/>
    </linearGradient>
  </defs>

  <!-- Connector lines with gradient fade from center outward -->
  <line x1="367" y1="232" x2="198" y2="116" stroke="url(#cl1)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="367" y1="232" x2="537" y2="116" stroke="url(#cl2)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="367" y1="232" x2="198" y2="349" stroke="url(#cl3)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="367" y1="232" x2="537" y2="349" stroke="url(#cl4)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Small junction dots where connectors meet outer nodes -->
  <circle cx="198" cy="116" r="2.4" fill="#091D33" opacity="0.22"/>
  <circle cx="537" cy="116" r="2.4" fill="#091D33" opacity="0.22"/>
  <circle cx="198" cy="349" r="2.4" fill="#091D33" opacity="0.22"/>
  <circle cx="537" cy="349" r="2.4" fill="#091D33" opacity="0.22"/>

  <!-- ================= CENTRAL NODE ================= -->
  <!-- Outer authority ring -->
  <circle cx="367" cy="232" r="66" fill="none" stroke="#091D33" stroke-width="0.5" opacity="0.06"/>
  <!-- Mid authority ring -->
  <circle cx="367" cy="232" r="62" fill="none" stroke="#091D33" stroke-width="0.8" opacity="0.10"/>
  <!-- Green accent ring -->
  <circle cx="367" cy="232" r="58" fill="none" stroke="#0A8C42" stroke-width="0.7" opacity="0.15"/>
  <!-- Main circle with shadow -->
  <g filter="url(#cs)">
    <circle cx="367" cy="232" r="52" fill="url(#cf)" stroke="#091D33" stroke-width="2.8"/>
  </g>
  <!-- Shield body - stronger, more authoritative -->
  <path d="M367 206 L390 215 V238 C390 253 367 263 367 263 C367 263 344 253 344 238 V215 Z"
        fill="#F2F6FA" stroke="#091D33" stroke-width="2.0" stroke-linejoin="round" opacity="0.82"/>
  <!-- Shield inner highlight -->
  <path d="M367 211 L385 218 V237 C385 249 367 257 367 257 C367 257 349 249 349 237 V218 Z"
        fill="none" stroke="#091D33" stroke-width="0.5" opacity="0.10"/>
  <!-- Green checkmark - bolder, more confident -->
  <polyline points="356,232 363,241 379,223" fill="none" stroke="url(#sg)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <!-- ================= TOP-LEFT NODE: Net Capital ================= -->
  <g filter="url(#ns)">
    <circle cx="198" cy="116" r="32" fill="url(#nf)" stroke="#091D33" stroke-width="1.7"/>
  </g>
  <!-- Dollar sign with vertical bars for weight -->
  <text x="198" y="120" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#091D33" opacity="0.65">$</text>
  <!-- Small upward trend indicator -->
  <polyline points="188,128 194,123 200,126 206,119" fill="none" stroke="#0A8C42" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.52"/>

  <!-- ================= TOP-RIGHT NODE: Reporting ================= -->
  <g filter="url(#ns)">
    <circle cx="537" cy="116" r="32" fill="url(#nf)" stroke="#091D33" stroke-width="1.7"/>
  </g>
  <!-- Document with folded corner -->
  <path d="M524 101 H547 V132 H524 Z" fill="none" stroke="#091D33" stroke-width="1.5" stroke-linejoin="round" opacity="0.65"/>
  <path d="M540 101 V108 H547" fill="none" stroke="#091D33" stroke-width="1.0" stroke-linejoin="round" opacity="0.40"/>
  <!-- Bar chart (report / filing) -->
  <line x1="526" y1="129" x2="545" y2="129" stroke="#091D33" stroke-width="0.7" opacity="0.30"/>
  <rect x="527" y="124" width="5" height="5" rx="0.5" fill="#091D33" opacity="0.38"/>
  <rect x="533" y="118" width="5" height="11" rx="0.5" fill="#091D33" opacity="0.42"/>
  <rect x="539" y="112" width="5" height="17" rx="0.5" fill="#0A8C42" opacity="0.50"/>

  <!-- ================= BOTTOM-LEFT NODE: Audit ================= -->
  <g filter="url(#ns)">
    <circle cx="198" cy="349" r="32" fill="url(#nf)" stroke="#091D33" stroke-width="1.7"/>
  </g>
  <!-- Magnifying glass lens (audit / review) -->
  <circle cx="194" cy="345" r="11" fill="none" stroke="#091D33" stroke-width="1.5" opacity="0.65"/>
  <!-- Magnifying glass handle -->
  <line x1="202" y1="353" x2="210" y2="361" stroke="#091D33" stroke-width="2.0" stroke-linecap="round" opacity="0.55"/>
  <!-- Green checkmark inside lens -->
  <polyline points="189,345 193,349 200,340" fill="none" stroke="#0A8C42" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

  <!-- ================= BOTTOM-RIGHT NODE: Books & Records ================= -->
  <g filter="url(#ns)">
    <circle cx="537" cy="349" r="32" fill="url(#nf)" stroke="#091D33" stroke-width="1.7"/>
  </g>
  <!-- Ledger grid (books & records / reconciliation) -->
  <rect x="523" y="336" width="28" height="26" rx="1.5" fill="none" stroke="#091D33" stroke-width="1.5" opacity="0.65"/>
  <!-- Header row divider -->
  <line x1="523" y1="343" x2="551" y2="343" stroke="#091D33" stroke-width="1.0" opacity="0.40"/>
  <!-- Data row divider -->
  <line x1="523" y1="350" x2="551" y2="350" stroke="#091D33" stroke-width="0.8" opacity="0.32"/>
  <!-- Column dividers -->
  <line x1="534" y1="336" x2="534" y2="362" stroke="#091D33" stroke-width="0.8" opacity="0.32"/>
  <line x1="545" y1="343" x2="545" y2="362" stroke="#091D33" stroke-width="0.8" opacity="0.30"/>
  <!-- Green accent cell (reconciled entry) -->
  <rect x="535" y="344" width="9" height="5" rx="0.5" fill="#0A8C42" opacity="0.20"/>

</svg>