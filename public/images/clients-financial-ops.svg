<svg width="640" height="440" viewBox="0 0 640 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0A8C42" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0A8C42" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="barAccent" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0A8C42" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#07793A" stop-opacity="0.64"/>
    </linearGradient>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A8C42" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0A8C42" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="ringActive" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A8C42" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#07793A" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="ringTrack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091D33" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#091D33" stop-opacity="0.04"/>
    </linearGradient>
  </defs>


  <!-- ============================================================ -->
  <!-- BACKGROUND STRUCTURAL GRID                                   -->
  <!-- Very subtle horizontal rules suggesting systematic oversight  -->
  <!-- ============================================================ -->

  <line x1="48" y1="110" x2="595" y2="110" stroke="#091D33" stroke-width="0.3" opacity="0.035"/>
  <line x1="48" y1="175" x2="595" y2="175" stroke="#091D33" stroke-width="0.3" opacity="0.035"/>
  <line x1="48" y1="240" x2="595" y2="240" stroke="#091D33" stroke-width="0.3" opacity="0.03"/>
  <line x1="48" y1="305" x2="595" y2="305" stroke="#091D33" stroke-width="0.3" opacity="0.03"/>


  <!-- ============================================================ -->
  <!-- ASCENDING CAPITAL BARS (left/center)                         -->
  <!-- Primary visual element — capital levels rising over periods   -->
  <!-- ============================================================ -->

  <!-- Baseline -->
  <line x1="48" y1="365" x2="330" y2="365" stroke="#091D33" stroke-width="0.7" opacity="0.14"/>

  <!-- Y-axis reference ticks -->
  <line x1="48" y1="305" x2="54" y2="305" stroke="#091D33" stroke-width="0.5" opacity="0.08"/>
  <line x1="48" y1="240" x2="54" y2="240" stroke="#091D33" stroke-width="0.5" opacity="0.08"/>
  <line x1="48" y1="175" x2="54" y2="175" stroke="#091D33" stroke-width="0.5" opacity="0.08"/>
  <line x1="48" y1="110" x2="54" y2="110" stroke="#091D33" stroke-width="0.5" opacity="0.06"/>

  <!-- Bar 1 (earliest period) -->
  <rect x="62" y="290" width="24" height="75" rx="1.5" fill="url(#barGrad)"/>
  <!-- Bar 2 -->
  <rect x="100" y="264" width="24" height="101" rx="1.5" fill="url(#barGrad)"/>
  <!-- Bar 3 -->
  <rect x="138" y="236" width="24" height="129" rx="1.5" fill="url(#barGrad)"/>
  <!-- Bar 4 — transition to accent color, stronger growth phase -->
  <rect x="176" y="212" width="24" height="153" rx="1.5" fill="url(#barAccent)"/>
  <!-- Bar 5 -->
  <rect x="214" y="186" width="24" height="179" rx="1.5" fill="url(#barAccent)"/>
  <!-- Bar 6 -->
  <rect x="252" y="158" width="24" height="207" rx="1.5" fill="url(#barAccent)"/>
  <!-- Bar 7 (current period, tallest) -->
  <rect x="290" y="128" width="24" height="237" rx="1.5" fill="url(#barAccent)"/>

  <!-- Cap mark on current period bar -->
  <rect x="290" y="126" width="24" height="3.5" rx="1.5" fill="#0A8C42" opacity="0.46"/>

  <!-- Regulatory minimum threshold line (green) -->
  <line x1="48" y1="244" x2="326" y2="244" stroke="#0B9E4A" stroke-width="1" stroke-dasharray="5,4" opacity="0.50"/>
  <!-- Threshold label mark -->
  <rect x="328" y="240" width="4" height="8" rx="1.5" fill="#0B9E4A" opacity="0.12"/>

  <!-- Trend line connecting bar tops -->
  <polyline points="74,290 112,264 150,236 188,212 226,186 264,158 302,128"
    fill="none" stroke="#0A8C42" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.22"/>

  <!-- Data point dots on trend line -->
  <circle cx="74" cy="290" r="2.5" fill="#0A8C42" opacity="0.32"/>
  <circle cx="112" cy="264" r="2.5" fill="#0A8C42" opacity="0.34"/>
  <circle cx="150" cy="236" r="2.5" fill="#0A8C42" opacity="0.36"/>
  <circle cx="188" cy="212" r="2.5" fill="#0A8C42" opacity="0.38"/>
  <circle cx="226" cy="186" r="2.5" fill="#0A8C42" opacity="0.40"/>
  <circle cx="264" cy="158" r="2.5" fill="#0A8C42" opacity="0.44"/>
  <circle cx="302" cy="128" r="3" fill="#0B9E4A" opacity="0.52"/>



  <!-- ============================================================ -->
  <!-- CAPITAL RATIO RING (upper right)                             -->
  <!-- Abstract donut metric suggesting capital adequacy ratio       -->
  <!-- ============================================================ -->

  <!-- Background track ring -->
  <circle cx="484" cy="138" r="58" fill="none" stroke="url(#ringTrack)" stroke-width="7"/>

  <!-- Active arc (~75% fill, circumference ~364, 75% = ~273) -->
  <circle cx="484" cy="138" r="58" fill="none" stroke="url(#ringActive)" stroke-width="7"
    stroke-dasharray="273 91" stroke-dashoffset="91" stroke-linecap="round"
    transform="rotate(-90 484 138)"/>

  <!-- Inner subtle ring -->
  <circle cx="484" cy="138" r="47" fill="none" stroke="#0A8C42" stroke-width="0.4" opacity="0.06"/>

  <!-- Abstract metric value in center -->
  <rect x="463" y="130" width="42" height="5.5" rx="2" fill="#091D33" opacity="0.26"/>
  <rect x="470" y="140" width="28" height="3.5" rx="1.5" fill="#091D33" opacity="0.13"/>

  <!-- Green indicator at arc start position (top of ring) -->
  <circle cx="484" cy="80" r="3" fill="#0B9E4A" opacity="0.56"/>


  <!-- ============================================================ -->
  <!-- MONITORING METRICS (lower right)                             -->
  <!-- Abstract proportion indicators — reporting breakdown          -->
  <!-- ============================================================ -->

  <!-- Metric 1 -->
  <rect x="398" y="270" width="36" height="3" rx="1" fill="#091D33" opacity="0.12"/>
  <rect x="450" y="266" width="120" height="9" rx="1.5" fill="#0A8C42" opacity="0.34"/>

  <!-- Metric 2 -->
  <rect x="398" y="296" width="30" height="3" rx="1" fill="#091D33" opacity="0.12"/>
  <rect x="450" y="292" width="90" height="9" rx="1.5" fill="#0A8C42" opacity="0.28"/>

  <!-- Metric 3 (strongest — suggests primary reporting metric) -->
  <rect x="398" y="322" width="42" height="3" rx="1" fill="#091D33" opacity="0.12"/>
  <rect x="450" y="318" width="138" height="9" rx="1.5" fill="#0A8C42" opacity="0.26"/>

  <!-- Metric 4 -->
  <rect x="398" y="348" width="26" height="3" rx="1" fill="#091D33" opacity="0.12"/>
  <rect x="450" y="344" width="74" height="9" rx="1.5" fill="#0A8C42" opacity="0.24"/>


  <!-- ============================================================ -->
  <!-- MONITORING TREND SWEEP (bottom span)                         -->
  <!-- Gentle area curve tying the composition together              -->
  <!-- ============================================================ -->

  <!-- Trend line -->
  <path d="M 44 408 Q 140 392, 230 398 T 410 384 T 596 376"
    fill="none" stroke="#0A8C42" stroke-width="1" stroke-linecap="round" opacity="0.30"/>

  <!-- Area fill beneath -->
  <path d="M 44 408 Q 140 392, 230 398 T 410 384 T 596 376 L 596 430 L 44 430 Z"
    fill="url(#areaFill)"/>

  <!-- Data point markers along trend -->
  <circle cx="140" cy="395" r="1.8" fill="#0A8C42" opacity="0.30"/>
  <circle cx="230" cy="398" r="1.8" fill="#0A8C42" opacity="0.30"/>
  <circle cx="320" cy="390" r="1.8" fill="#0A8C42" opacity="0.32"/>
  <circle cx="410" cy="384" r="2" fill="#0A8C42" opacity="0.34"/>
  <circle cx="500" cy="380" r="1.8" fill="#0A8C42" opacity="0.32"/>
  <circle cx="596" cy="376" r="2" fill="#0A8C42" opacity="0.38"/>


  <!-- ============================================================ -->
  <!-- COMPLIANCE SHIELD ACCENT (upper right corner)                -->
  <!-- Subtle oversight authority mark — not prominent, just accent  -->
  <!-- ============================================================ -->

  <!-- Shield -->
  <path d="M580 38 L588 41.5 V48 C588 52.5 580 56 580 56 C580 56 572 52.5 572 48 V41.5 Z"
    fill="#0A8C42" opacity="0.05" stroke="#0A8C42" stroke-width="0.5" stroke-opacity="0.14"/>

  <!-- Green checkmark -->
  <polyline points="576,47 579,50.5 585,43" fill="none" stroke="#0B9E4A"
    stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.40"/>


  <!-- ============================================================ -->
  <!-- STRUCTURAL CONNECTORS                                        -->
  <!-- Subtle links suggesting systematic relationships              -->
  <!-- ============================================================ -->

  <!-- Bar area to ring -->
  <line x1="326" y1="178" x2="424" y2="150" stroke="#0A8C42" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.12"/>

  <!-- Ring to metrics -->
  <line x1="472" y1="198" x2="456" y2="262" stroke="#0A8C42" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.10"/>


  <!-- ============================================================ -->
  <!-- FLOATING ABSTRACT LABELS                                     -->
  <!-- Suggest key financial figures without literal text            -->
  <!-- ============================================================ -->

  <!-- Label near bars (upper left) — suggests chart title/metric name -->
  <rect x="56" y="88" width="52" height="4.5" rx="1.5" fill="#091D33" opacity="0.18"/>
  <rect x="56" y="96" width="32" height="3" rx="1" fill="#091D33" opacity="0.10"/>

  <!-- Small section label above metrics -->
  <rect x="398" y="248" width="56" height="3.5" rx="1.5" fill="#091D33" opacity="0.15"/>

</svg>